
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CodeMate AI{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/student.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Common Student Navigation -->
    <header class="student-navbar">

        <div class="student-navbar-brand">
            CodeMate AI
        </div>

        <nav class="student-navbar-links">
            <a href="{% url 'student_dashboard' %}">Dashboard</a>
            <a href="#">Feedback</a>

            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="student-logout-button">
                    Logout
                </button>
            </form>
        </nav>

    </header>

    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

</body>
</html>
