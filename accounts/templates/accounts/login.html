<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeMate AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #0b1120 url("{% static 'images/codemate_bg_3.png' %}") center center / cover no-repeat fixed;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 800px;
            background: #151e30;
            border: 1px solid #26344d;
            border-radius: 18px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            background: #2563eb;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 27px;
            font-weight: bold;
            color: white;
        }

        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            color: white;
        }

        .brand p {
            color: #94a3b8;
            font-size: 15px;
        }

        .login-title {
            font-size: 27px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 16px;
        }

        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 14px;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #0f172a;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #60a5fa;
            font-size: 12px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        .signup-text a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
}
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">
            <div class="brand-icon">&lt;/&gt;</div>
            <h1>CodeMate AI</h1>
            <p>Your Personal Programming Learning Companion</p>
        </div>

        <h2 class="login-title">Welcome Back</h2>
        <p class="subtitle">Sign in to continue your learning journey.</p>
        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}
        

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <div class="password-wrapper">
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Enter your password" required>

                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup-text">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </div>

        <div class="footer-text">
            © 2026 CodeMate AI. All rights reserved.
        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>

</html>
