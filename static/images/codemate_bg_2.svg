<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#081a24"/>
    </linearGradient>
    <radialGradient id="auroraTeal" cx="85%" cy="15%" r="55%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="10%" cy="90%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraBlue" cx="50%" cy="50%" r="40%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#auroraTeal)"/>
  <rect width="1920" height="1080" fill="url(#auroraViolet)"/>
  <rect width="1920" height="1080" fill="url(#auroraBlue)"/>

  <!-- flowing aurora ribbons -->
  <g fill="none" stroke="url(#waveA)" stroke-width="2" opacity="0.8">
    <path d="M-50 260 C 300 120, 600 380, 960 240 S 1600 120, 1980 300"/>
    <path d="M-50 300 C 320 170, 620 420, 980 280 S 1620 170, 1980 340"/>
    <path d="M-50 340 C 340 220, 640 460, 1000 320 S 1640 220, 1980 380"/>
    <path d="M-50 800 C 300 700, 640 900, 1000 790 S 1600 690, 1980 820"/>
    <path d="M-50 840 C 320 750, 660 940, 1020 830 S 1620 740, 1980 860"/>
  </g>

  <!-- faint binary rain, edges only -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#93c5fd" fill-opacity="0.10">
    <text x="40" y="60">0110 1001 0011</text>
    <text x="40" y="90">1010 0110 1100</text>
    <text x="40" y="120">0011 1001 0101</text>
    <text x="1640" y="1000">1100 0101 0110</text>
    <text x="1640" y="1030">0011 1010 1001</text>
    <text x="1640" y="1060">0110 0011 1100</text>
  </g>

  <!-- learning path: winding road from bottom-left (Beginner) to top-right (Advanced) -->
  <path d="M120 960 C 420 900, 300 700, 560 640 S 760 420, 1000 460 S 1300 260, 1560 220 S 1780 120, 1840 90"
        fill="none" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round" opacity="0.22" filter="url(#glowF)"/>
  <path d="M120 960 C 420 900, 300 700, 560 640 S 760 420, 1000 460 S 1300 260, 1560 220 S 1780 120, 1840 90"
        fill="none" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.9"/>

  <!-- milestones -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#e2e8f0">
    <!-- Beginner -->
    <circle cx="150" cy="952" r="16" fill="#a78bfa" fill-opacity="0.25"/>
    <circle cx="150" cy="952" r="7" fill="#c4b5fd"/>
    <text x="178" y="946">Variables</text>
    <text x="178" y="968" font-size="13" fill="#a78bfa">Beginner</text>

    <circle cx="352" cy="808" r="16" fill="#a78bfa" fill-opacity="0.25"/>
    <circle cx="352" cy="808" r="7" fill="#c4b5fd"/>
    <text x="380" y="802">Loops</text>

    <!-- Intermediate -->
    <circle cx="560" cy="640" r="16" fill="#60a5fa" fill-opacity="0.25"/>
    <circle cx="560" cy="640" r="7" fill="#93c5fd"/>
    <text x="588" y="634">Functions</text>
    <text x="588" y="656" font-size="13" fill="#60a5fa">Intermediate</text>

    <circle cx="790" cy="500" r="16" fill="#60a5fa" fill-opacity="0.25"/>
    <circle cx="790" cy="500" r="7" fill="#93c5fd"/>
    <text x="818" y="494">Lists &amp; Dictionaries</text>

    <!-- Advanced -->
    <circle cx="1250" cy="352" r="16" fill="#2dd4bf" fill-opacity="0.25"/>
    <circle cx="1250" cy="352" r="7" fill="#5eead4"/>
    <text x="1278" y="346">Classes &amp; Objects</text>
    <text x="1278" y="368" font-size="13" fill="#2dd4bf">Advanced</text>

    <circle cx="1560" cy="220" r="16" fill="#2dd4bf" fill-opacity="0.25"/>
    <circle cx="1560" cy="220" r="7" fill="#5eead4"/>
    <text x="1588" y="214">Exception Handling</text>

    <circle cx="1810" cy="108" r="20" fill="#2dd4bf" fill-opacity="0.30"/>
    <circle cx="1810" cy="108" r="9" fill="#99f6e4"/>
    <text x="1782" y="152" font-size="15" fill="#99f6e4">Mastery</text>
  </g>

  <!-- soft code tags in corners -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#a5b4fc" fill-opacity="0.12">
    <text x="70" y="420" font-size="150">{</text>
    <text x="1720" y="760" font-size="150">}</text>
    <text x="1380" y="900" font-size="64">&lt;/&gt;</text>
    <text x="200" y="260" font-size="56">def</text>
    <text x="1500" y="520" font-size="48">class</text>
  </g>

  <!-- calm centre for the login card -->
  <ellipse cx="960" cy="540" rx="400" ry="430" fill="#0a0f1e" fill-opacity="0.6" filter="url(#soft)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
