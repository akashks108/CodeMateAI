{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CodeMate AI Admin{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">

            <div class="admin-brand">
                CodeMate AI
                <small>Administrator</small>
            </div>

            <nav class="admin-nav">
                <a href="{% url 'admin_dashboard' %}" class="{% if active_page == 'home' %}active{% endif %}">
                    Home
                </a>

                <a href="{% url 'student_list' %}" class="{% if active_page == 'students' %}active{% endif %}">
                    Students
                </a>

                <a href="{% url 'curriculum_management' %}"
                    class="{% if active_page == 'curriculum' %}active{% endif %}">
                    Curriculum Management
                </a>

                <a href="#">
                    Feedback
                </a>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">Logout</button>
                </form>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>

</html>
