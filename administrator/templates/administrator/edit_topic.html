
{% extends 'administrator/base.html' %}

{% block title %}Edit Topic | CodeMate AI{% endblock %}

{% block content %}

<h1 class="admin-page-title">Edit Topic</h1>

<p class="admin-page-subtitle">
    Update the topic in {{ topic.level.name }} of {{ topic.level.language.name }}.
</p>

<div class="admin-form-card">

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="admin-form-group">
            <label class="admin-form-label">
                Programming Language
            </label>

            <input
                type="text"
                class="admin-form-control"
                value="{{ topic.level.language.name }}"
                disabled
            >
        </div>

        <div class="admin-form-group">
            <label class="admin-form-label">
                Learning Level
            </label>

            <input
                type="text"
                class="admin-form-control"
                value="{{ topic.level.name }}"
                disabled
            >
        </div>

        <div class="admin-form-group">
            <label for="title" class="admin-form-label">
                Topic Title
            </label>

            <input
                type="text"
                name="title"
                id="title"
                class="admin-form-control"
                maxlength="150"
                value="{{ topic.title }}"
                required
            >
        </div>

        <div class="admin-form-actions">

            <button type="submit" class="admin-btn">
                Save Changes
            </button>

            <a
                href="{% url 'curriculum_management' %}?language={{ topic.level.language.slug }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
